<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 120" width="840" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE6F4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .fa { font-family: Tahoma, "Segoe UI", Vazirmatn, Arial, sans-serif; }
    .en { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .line { transform-box: fill-box; transform-origin: center; animation: grow 4s ease-in-out infinite; }
    @keyframes grow { 0%,100% { transform: scaleX(0.4); opacity: .6; } 50% { transform: scaleX(1); opacity: 1; } }
    .spark { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .spark.b { animation-delay: 1.2s; }
    @keyframes pulse { 0%,100% { transform: scale(0.85); opacity: .7; } 50% { transform: scale(1.1); opacity: 1; } }
    .en-line { animation: fade 4s ease-in-out infinite; }
    @keyframes fade { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
    .shine { animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-420px); } 60%,100% { transform: translateX(840px); } }
  </style>
  <rect x="0.5" y="0.5" width="839" height="119" rx="14" fill="url(#bg)" stroke="#D0D7DE"/>
  <rect class="line" x="170" y="18" width="500" height="2" rx="1" fill="#0969DA"/>
  <text class="fa" x="420" y="62" text-anchor="middle" direction="rtl" xml:lang="fa" font-size="24" font-weight="700" fill="#14213D">اگر پروژه‌هایم برایتان مفید بود، ستاره دادن فراموش نشه!</text>
  <text class="en en-line" x="420" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#59636E">If you find my projects useful, give it a star</text>
  <rect class="line" x="170" y="104" width="500" height="2" rx="1" fill="#0969DA"/>
  <path class="spark a" d="M46,49 L48.42,57.58 L57,60 L48.42,62.42 L46,71 L43.58,62.42 L35,60 L43.58,57.58 Z" fill="#E68C14"/>
  <path class="spark b" d="M794,49 L796.42,57.58 L805,60 L796.42,62.42 L794,71 L791.58,62.42 L783,60 L791.58,57.58 Z" fill="#E68C14"/>
</svg>
