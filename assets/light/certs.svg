<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 480" width="804" height="480">
  <defs>
    <linearGradient id="bglight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3F6FC"/><stop offset="1" stop-color="#DCE5F5"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .head { animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
    .card { transform-box: fill-box; transform-origin: center; opacity: 1; animation: flip 7s ease-in-out infinite; }
    @keyframes flip {
      0% { opacity: 0; transform: perspective(600px) rotateY(-70deg) translateY(10px); }
      12%, 70% { opacity: 1; transform: perspective(600px) rotateY(0deg) translateY(0); }
      85%, 100% { opacity: 0; transform: perspective(600px) rotateY(70deg) translateY(10px); }
    }
    .ring { stroke-dasharray: 126; stroke-dashoffset: 126; animation: spin 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { 0%,15% { stroke-dashoffset: 126; } 45%,100% { stroke-dashoffset: 0; } }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 7s ease-out infinite; }
    @keyframes grow { 0%,15% { transform: scaleX(0); } 45%,100% { transform: scaleX(1); } }
    .shine { opacity: 0; animation: sweep 7s ease-in-out infinite; transform-box: fill-box; }
    @keyframes sweep { 0%,40% { opacity: 0; transform: translateX(-200px); } 50% { opacity: 1; } 60%,100% { opacity: 0; transform: translateX(200px); } }
  </style>
  <rect width="804" height="480" rx="22" fill="url(#bglight)"/>
  <text class="head" x="28" y="48" font-size="24" font-weight="800" fill="#14213D">Certifications &amp; Progress</text>
  <rect x="28" y="58" width="90" height="4" rx="2" fill="#0969DA"/>
  <text x="776" y="48" text-anchor="end" font-size="15" fill="#374357">2 done | 6 in progress</text>

  <!-- ===== ردیف اول ===== -->

  <!-- OSCP 30% Studying 2027 Q2 -->
  <g class="card" style="animation-delay:0.00s">
    <rect x="26" y="84" width="180" height="180" rx="18" fill="#FFFFFF" stroke="#D5DDEB" stroke-width="1.5"/>
    <rect x="26" y="84" width="180" height="10" rx="5" fill="#F0883E"/>
    <circle cx="116" cy="150" r="34" fill="#F0883E" opacity="0.18"/>
    <circle cx="116" cy="150" r="24" fill="none" stroke="#F0883E" stroke-width="3" class="ring"/>
    <text x="116" y="156" text-anchor="middle" font-size="16" font-weight="800" fill="#F0883E">30%</text>
    <text x="116" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#14213D">OSCP</text>
    <text x="116" y="222" text-anchor="middle" font-size="12" fill="#374357">Studying | Q2 2027</text>
